name: Build Store ERP for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "store-erp-flutter/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: store-erp-flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if missing
        shell: pwsh
        run: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Format Dart source
        shell: pwsh
        run: |
          dart format lib
          if ($LASTEXITCODE -ne 0) { throw "dart format failed." }

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw "Flutter analysis found errors; see diagnostics above." }

      - name: Run Flutter widget tests
        shell: pwsh
        run: |
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw "Flutter widget tests failed." }

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed." }

      - name: Package Windows app
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          if (!(Test-Path $releaseDir)) {
            throw "Windows Release directory was not found."
          }
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No .exe file was produced by the Windows build."
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "../Store-ERP-Windows-x64.zip" -Force
          Write-Host "Executable: $($exe.FullName)"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Store-ERP-Windows-x64
          path: Store-ERP-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
