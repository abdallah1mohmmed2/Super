name: Build Store ERP for Windows

on:
  push:
    branches: [main]
    paths:
      - "store-erp-upload.zip"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: pwsh
        run: |
          if (!(Test-Path "store-erp-upload.zip")) {
            throw "store-erp-upload.zip is missing from repository root."
          }

      - name: Extract Flutter project
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "store-erp-source"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath "store-erp-upload.zip" -DestinationPath $destination -Force
          $pubspec = Get-ChildItem -LiteralPath $destination -Filter "pubspec.yaml" -File -Recurse |
            Select-Object -First 1
          if ($null -eq $pubspec) {
            throw "No pubspec.yaml found inside store-erp-upload.zip. The archive must contain a Flutter project."
          }
          "FLUTTER_PROJECT_DIR=$($pubspec.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Flutter project found at $($pubspec.Directory.FullName)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Store-ERP-Windows-Release
          path: |
            ${{ env.RUNNER_TEMP }}/store-erp-source/**/build/windows/**/runner/Release/**
            ${{ env.RUNNER_TEMP }}/store-erp-source/**/build/windows/runner/Release/**
          if-no-files-found: error
          retention-days: 14
