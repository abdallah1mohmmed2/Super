name: Build Store ERP for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "store-erp-upload.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project archive
        shell: pwsh
        run: |
          if (!(Test-Path "store-erp-upload.zip")) {
            throw "store-erp-upload.zip was not found in the repository root."
          }

      - name: Extract Flutter project
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "store_erp_source"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath "store-erp-upload.zip" -DestinationPath $destination -Force
          $pubspec = Get-ChildItem -Path $destination -Filter "pubspec.yaml" -Recurse -File | Select-Object -First 1
          if ($null -eq $pubspec) {
            throw "No pubspec.yaml was found inside store-erp-upload.zip. Check the ZIP contents."
          }
          $projectRoot = $pubspec.Directory.FullName
          "PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Flutter project found at: $projectRoot"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_ROOT
          flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Store-ERP-Windows-Release
          path: ${{ runner.temp }}/store_erp_source/**/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
