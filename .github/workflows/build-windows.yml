name: Build Store ERP for Windows

on:
  push:
    branches: [main]
    paths:
      - "store-erp-upload.zip"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: pwsh
        run: |
          if (!(Test-Path ".\\store-erp-upload.zip")) {
            throw "store-erp-upload.zip is missing from repository root."
          }

      - name: Extract Flutter project
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "store-erp-source"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath ".\\store-erp-upload.zip" -DestinationPath $destination -Force
          $pubspec = Get-ChildItem -LiteralPath $destination -Filter "pubspec.yaml" -File -Recurse |
            Select-Object -First 1
          if ($null -eq $pubspec) {
            throw "No pubspec.yaml found inside store-erp-upload.zip."
          }
          $projectDir = $pubspec.Directory.FullName
          "FLUTTER_PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Flutter project: $projectDir"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          if (!(Test-Path "windows\\CMakeLists.txt")) {
            flutter create --platforms=windows .
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          flutter pub get


      - name: Diagnose Dart syntax errors
        if: always()
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          $targets = @(
            @{ Path = "lib/screens/login_screen.dart"; Lines = @(1, 15) },
            @{ Path = "lib/screens/modules/closing_screen.dart"; Lines = @(15, 30) },
            @{ Path = "lib/screens/data_screen.dart"; Lines = @(195, 215) },
            @{ Path = "lib/screens/data_screen.dart"; Lines = @(395, 420) }
          )
          foreach ($target in $targets) {
            Write-Host "===== $($target.Path):$($target.Lines[0])-$($target.Lines[1]) ====="
            $lineNo = 0
            Get-Content $target.Path | ForEach-Object {
              $lineNo++
              if ($lineNo -ge $target.Lines[0] -and $lineNo -le $target.Lines[1]) {
                Write-Host ("{0}: {1}" -f $lineNo, $_)
              }
            }
          }

      - name: Repair known Dart delimiter errors
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          $targets = @{
            "lib/screens/login_screen.dart" = @{ 9 = "append" }
            "lib/screens/modules/closing_screen.dart" = @{ 23 = "append" }
            "lib/screens/data_screen.dart" = @{ 208 = "remove" ; 403 = "append" ; 413 = "append" }
          }
          foreach ($path in $targets.Keys) {
            $lines = [System.Collections.Generic.List[string]]::new()
            (Get-Content -LiteralPath $path) | ForEach-Object { $lines.Add($_) }
            foreach ($lineNo in $targets[$path].Keys) {
              $line = $lines[[int]$lineNo - 1]
              if ($targets[$path][$lineNo] -eq "append") {
                $lines[[int]$lineNo - 1] = $line + ")"
              } else {
                if ($line.EndsWith(");")) {
                  $lines[[int]$lineNo - 1] = $line.Substring(0, $line.Length - 2) + ";"
                } elseif ($line.EndsWith(")));")) {
                  $lines[[int]$lineNo - 1] = $line.Substring(0, $line.Length - 3) + "));"
                } else {
                  throw "Unexpected ending at $path line $lineNo : $line"
                }
              }
            }
            Set-Content -LiteralPath $path -Value $lines -Encoding utf8
          }
          dart format lib/screens/login_screen.dart lib/screens/modules/closing_screen.dart lib/screens/data_screen.dart
          flutter analyze --no-pub

      - name: Build Windows release
        shell: pwsh
        run: |
          Set-Location "$env:FLUTTER_PROJECT_DIR"
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed." }

      - name: Stage release files
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:FLUTTER_PROJECT_DIR "build\\windows\\x64\\runner\\Release"),
            (Join-Path $env:FLUTTER_PROJECT_DIR "build\\windows\\runner\\Release")
          )
          $release = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$release) {
            throw "Build completed but the Windows Release folder was not found."
          }
          $staging = Join-Path $env:RUNNER_TEMP "Store-ERP-Windows-Release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $release "*") -Destination $staging -Recurse -Force
          if (!(Get-ChildItem -Path $staging -File -Recurse | Where-Object { $_.Extension -eq ".exe" })) {
            throw "No .exe file found in the staged release."
          }
          "STORE_ERP_RELEASE_DIR=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Path $staging -Recurse

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Store-ERP-Windows-Release
          path: ${{ env.STORE_ERP_RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 14
